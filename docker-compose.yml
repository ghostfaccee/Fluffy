services:
  db:
    image: postgres:15
    container_name: fluffy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - fluffy_data:/var/lib/postgresql/data
    profiles:
      - prod
  
  testdb:
    image: postgres:15
    container_name: fluffy-testdb
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - fluffy_testdata:/var/lib/postgresql/data
    profiles:
      - test
  
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: fluffy-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672" # amqp
      - "15672:15672" # for debug/http
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    profiles:
      - prod
  
  redis:
    image: redis:8.8-alpine
    container_name: fluffy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - prod
      - test

  worker:
    build: .
    container_name: fluffy-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - .:/app
    command: celery -A app.core.celery worker --loglevel=info --concurrency=2
    restart: unless-stopped
    profiles:
      - prod
    
  api:
    build: .
    container_name: fluffy
    depends_on:
      - db
      - redis
      - rabbitmq
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    profiles:
      - prod
  
  testapi:
    build: .
    container_name: testfluffy
    depends_on:
      - testdb
      - redis
    ports:
      - "8001:8000"
    environment:
      POSTGRES_URL: ${TEST_POSTGRES_URL}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    profiles:
      - test

volumes:
  fluffy_data:
  fluffy_testdata:
  rabbitmq_data:
