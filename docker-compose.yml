services:
  db:
    image: postgres:15
    container_name: fluffy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - fluffy_data:/var/lib/postgresql/data
    profiles:
      - prod
  
  testdb:
    image: postgres:15
    container_name: fluffy-testdb
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - fluffy_testdata:/var/lib/postgresql/data
    profiles:
      - test
  
  redis:
    image: redis:8.8-alpine
    container_name: fluffy-redis
    ports:
      - "6379:6379"
    profiles:
      - prod
      - test

  worker:
    build: .
    container_name: fluffy-worker
    depends_on:
      - redis
    environment:
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - .:/app
    command: celery -A app.core.celery worker --loglevel=info
    restart: unless-stopped
    profiles:
        - prod
    
  api:
    build: .
    container_name: fluffy
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    profiles:
      - prod
  
  testapi:
    build: .
    container_name: testfluffy
    depends_on:
      - testdb
      - redis
    ports:
      - "8001:8000"
    environment:
      POSTGRES_URL: ${TEST_POSTGRES_URL}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    profiles:
      - test

volumes:
  fluffy_data:
  fluffy_testdata: