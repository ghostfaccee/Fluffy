name: Pytests check | CI

on:
  push:
    branches: [ 'main', 'v1/dev' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Create .env file
      run: |
        cat > .env << EOF
        TEST_POSTGRES_URL = ${{ secrets.TEST_POSTGRES_URL }}
        REDIS_URL = ${{ secrets.REDIS_URL }}
        TEST_POSTGRES_USER = ${{ secrets.TEST_POSTGRES_USER }}
        TEST_POSTGRES_PASSWORD = ${{ secrets.TEST_POSTGRES_PASSWORD }}
        TEST_POSTGRES_DB = ${{ secrets.TEST_POSTGRES_DB }}
        SECRET_JWT_KEY = ${{ secrets.SECRET_JWT_KEY }}
        SECRET_REFRESH_KEY = ${{ secrets.SECRET_REFRESH_KEY }}
        EOF
      
    - name: Run docker compose
      run: |
        docker compose --profile test up -d --build

    - name: Show API logs
      run: |
        docker compose logs testapi --tail 50
        
    - name: Run tests
      run: |
        docker compose exec testapi pytest -v
        
    - name: Check container is running
      run: |
        docker ps | grep testprism
        
    - name: Stop and remove containers
      run: |
        docker compose --profile test down -v
