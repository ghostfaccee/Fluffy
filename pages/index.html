<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluffy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D4399;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }

        .header {
            background: #0D4399;
            border-bottom: 2px solid #ffffff;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
        }

        .card {
            max-width: 520px;
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }

        .card h1 {
            font-size: 38px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .card .sub {
            font-size: 20px;
            font-weight: 400;
            color: rgba(255,255,255,0.95);
            margin-bottom: 12px;
        }

        .card .desc {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            line-height: 1.7;
            margin-top: 8px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .card .desc strong {
            color: #ffffff;
            font-weight: 500;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: #ffffff;
            margin: 24px auto 22px;
            opacity: 0.4;
        }

        .status {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 14px;
            color: #ffffff;
            margin-top: 24px;
        }

        .status span {
            background: rgba(255,255,255,0.12);
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 450;
            letter-spacing: 0.3px;
        }

        .status .active {
            background: #ffffff;
            color: #0D4399;
            font-weight: 500;
        }

        .footer {
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            background: #0D4399;
        }

        .footer span {
            opacity: 0.9;
        }

        .footer .white {
            color: #ffffff;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header {
                padding: 14px 18px;
            }
            .card h1 {
                font-size: 30px;
            }
            .card .sub {
                font-size: 17px;
            }
            .card .desc {
                font-size: 15px;
            }
            .status {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .footer {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">Fluffy</div>
    </header>

    <main class="main">
        <div class="card">
            <h1>Ну вот, вы сломали четвертую стену</h1>
            <div class="sub">Вы видите эту страницу, потому что проект в разработке и пока не вышел в релиз.</div>
            <div class="divider"></div>
            <div class="status">
                <span class="active">В разработке</span>
                <span>???</span>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>2026 | ghostfaccee</span>
        <span>Made with ❤</span>
        <span>Это реально четвертая стена</span>
    </footer>
</body>
</html>
